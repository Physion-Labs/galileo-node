name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails if the contract copy was edited here instead of upstream, or if the
      # committed types are not what the contract generates.
      - run: pnpm contract:check
      - run: pnpm typecheck
      - run: pnpm test

  # Talks to the development deployment. Deliberately NOT required: it fails when
  # that deployment is down or mid-rollout, which is not the pull request's fault
  # — but it is the only check that would notice the API drifting away from the
  # contract, so it runs on every change and is read rather than gated on.
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - run: pnpm verify:live
